instruction: |-
  Fix a CMake-based C++ project in /app that builds two shared libraries (libmath and libcalc) and an executable (calculator) that depends on them. The build is currently broken: headers are not propagated between targets, libcalc does not declare its dependency on libmath, the libraries are unversioned, the executable cannot locate the shared libraries at runtime, and the link order is wrong.

  Project layout:
  CMakeLists.txt (top-level project)
  libs/libmath/CMakeLists.txt, include/math.hpp, src/math.cpp
  libs/libcalc/CMakeLists.txt, include/calc.hpp, src/calc.cpp (calc depends on math)
  app/CMakeLists.txt, src/main.cpp

  The project is built out of source with:
    mkdir -p /app/build && cd /app/build && cmake .. && cmake --build . -j

  Requirements:
  - A clean configure and parallel build succeeds, and a second build is a successful no-op
  - build/bin/calculator runs and prints exactly: "Calculator result: 42"
  - Shared libraries are produced at build/lib/libmath.so and build/lib/libcalc.so, each with a SONAME and version (1.0.0)
  - build/compile_commands.json is generated (enable CMAKE_EXPORT_COMPILE_COMMANDS)
  - calculator has an RPATH/RUNPATH so `ldd build/bin/calculator` resolves every library without LD_LIBRARY_PATH
  - app/CMakeLists.txt links calculator against math before calc (target_link_libraries(calculator PRIVATE math calc))
  - Libraries export their include directories as PUBLIC; app/CMakeLists.txt must not call target_include_directories on calculator
  - app/CMakeLists.txt declares add_dependencies(calculator math calc) to avoid parallel build races
  - Install rules for the libraries are recommended but not required

  Constraints:
  - Fix the existing CMakeLists.txt files; do not replace CMake or edit the sources or tests
  - Do not disable parallel builds or set LD_LIBRARY_PATH
  - Do not leave stray files in /app outside build/ (the provided applypatch helpers may stay)

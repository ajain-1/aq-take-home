line-length = 110
target-version = "py312"
extend-exclude = ["terminal_bench", "tasks", "results"]

[lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# FastAPI's dependency markers (File(), Form(), Depends()) are meant to be called in defaults.
ignore = ["B008"]

[lint.isort]
known-first-party = ["api", "runner"]
